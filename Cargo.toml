[package]
name = "adocs"
version = "0.1.0"
edition = "2021"
description = "Agent docs (adocs) - Navigation map for codebases"
license = "MIT"
repository = "https://github.com/gmars1/adocs"
homepage = "https://github.com/gmars1/adocs"
readme = "README.md"
keywords = ["agents", "mcp", "docs", "cli"]
include = [
    "Cargo.toml",
    "Cargo.lock",
    "LICENSE",
    "README.md",
    "configuration.md",
    "src/**",
    "tests/**",
]

[[bin]]
name = "adocs"
path = "src/bin/adocs.rs"

[[bin]]
name = "adocs-mcp"
path = "src/bin/adocs-mcp.rs"

[dependencies]
anyhow = "1"
camino = { version = "1", features = ["serde1"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
toml = "0.8"
ulid = "1"
notify = "8"
pathdiff = "0.2"
rmcp = { version = "0.16", features = ["server", "transport-io"] }
schemars = "1"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
