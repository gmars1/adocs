name: Publish crate

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run cargo publish --dry-run instead of publishing"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    name: crates-io
    runs-on: ubuntu-latest
    environment: crates-io

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Check release ref
        if: ${{ inputs.dry_run == false }}
        run: |
          case "${GITHUB_REF}" in
            refs/tags/v*) ;;
            *)
              echo "Publishing is only allowed from version tags like v0.1.0."
              exit 1
              ;;
          esac

      - name: Test
        run: cargo test --all-targets --all-features --locked

      - name: Package crate
        run: cargo package --locked

      - name: Publish dry run
        if: ${{ inputs.dry_run }}
        run: cargo publish --dry-run --locked

      - name: Publish to crates.io
        if: ${{ inputs.dry_run == false }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked --token "${CARGO_REGISTRY_TOKEN}"
